# Builds the aipostgen-web Cloud Run image on GCP (never locally).
#   gcloud builds submit --config=cloudbuild.cloudrun.yaml \
#     --substitutions=_TAG=v1 --project=edentist-dev --region=me-central2
substitutions:
  _TAG: latest
  _IMAGE: me-central2-docker.pkg.dev/edentist-dev/edentist/aipostgen-web

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.cloudrun
      - -t
      - ${_IMAGE}:${_TAG}
      - -t
      - ${_IMAGE}:latest
      - .

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
